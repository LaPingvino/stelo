name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The game packages' tests need no display; cmd/stelo (Ebitengine on
      # desktop) is only built for the web here, which needs no X11.
      - run: go test . ./internal/... ./cmd/convert ./cmd/render
      - name: Build the WebAssembly game
        run: |
          mkdir -p site
          GOOS=js GOARCH=wasm go build -ldflags='-s -w' -o site/stelo.wasm ./cmd/stelo
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/
          cp web/index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
